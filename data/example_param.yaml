# acquisition_method can be either "DDA" or "DIA"
acquisition_method: DIA

# input_files is a list of raw files to be searched.
# input_dir can be specified instead of input_files, and all raw files in the directory will be searched.
input_files:
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_171-A.mzML
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_172-B.mzML
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_173-A.mzML
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_174-B.mzML
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_175-A.mzML
  - /data1/MassSpecData/DIA-QE/DIA/collinsb_X1803_176-B.mzML

output_directory: /data1/MassSpecData/DIA-QE/DIA/delpi
output_format: parquet # output_format can be either "tsv" or "parquet"
output_decoy: true # output_decoy can be either true or false, default is false

# search parameters
ms1_mass_tol_in_ppm: 10
ms2_mass_tol_in_ppm: 10
q_value_cutoff: 0.01
# protein grouping mode: "lead_only" or "parsimonious_grouping" (default)
grouping_type: parsimonious_grouping
# enable_transfer_learning enables the 2-stage search that fine-tunes the models
# (transfer learning) between a first and second search. When omitted or false,
# a single-stage search is performed.
# This is unnecessary for typical global or phospho proteomics searches, but is
# beneficial for searches involving rare or unseen PTMs.
enable_transfer_learning: false
# decoy_method can be either "mutation", or "pseudo_shuffle", or "pseudo_reverse", 
# default is "mutation", which is recommended for better FDR estimation
decoy_method: mutation

database_directory: /data1/MassSpecData/DIA-QE/DIA/delpi/speclib

# fasta_file is required for building the peptide database if it doesn't exist.
fasta_file: /data1/MassSpecData/DIA-QE/DIA/target_protein_sequences.fasta
digest:
  enzyme: trypsin
  min_len: 7
  max_len: 30
  max_missed_cleavages: 1
  n_term_methionine_excision: true

modification:
  max_mods: 2     # max number of variable modifications per peptide
  mod_param_set:
    # mod_name can be either a UniMod accession (e.g., "UniMod:4") or a common name (e.g., "Carbamidomethyl")
    # residue is the amino acid residue that can be modified (e.g., "C" for cysteine, "*" for any residue)
    # location can be "anywhere", "protein_n_term", "protein_c_term", or "peptide_n_term", "peptide_c_term"
  - mod_name: UniMod:4  # Carbamidomethyl
    residue: C
    location: anywhere
    fixed: true
  - mod_name: UniMod:35 # Oxidation
    residue: M
    location: anywhere
    fixed: false
  - mod_name: UniMod:1 # Acetyl
    residue: "*"
    location: protein_n_term
    fixed: false
  # - mod_name: UniMod:2 # Phospho
  #   residue: S
  #   location: anywhere
  #   fixed: False
  # - mod_name: UniMod:2 # Phospho
  #   residue: T
  #   location: anywhere
  #   fixed: False
  # - mod_name: UniMod:2 # Phospho
  #   residue: Y
  #   location: anywhere
  #   fixed: False            

precursor:
  min_charge: 1
  max_charge: 4
  min_mz: 300
  max_mz: 1800

fragment:
  min_charge: 1
  max_charge: 2
  min_mz: 200
  max_mz: 1800
